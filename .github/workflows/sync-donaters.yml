name: Sync donaters.json to FunPay-Tools
on:
  push:
    branches: [ main ]
    paths:
      - 'donaters.json'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            donaters.json
          sparse-checkout-cone-mode: false
      - name: Checkout target repo (FunPay-Tools)
        uses: actions/checkout@v5
        with:
          repository: XaviersDev/FunPay-Tools
          token: ${{ secrets.SYNC_TOKEN }}
          path: target
      - name: Copy & commit
        run: |
          cp donaters.json target/donaters.json
          cd target
          git config user.name  "donaters-sync-bot"
          git config user.email "actions@github.com"
          git add donaters.json
          if git diff --cached --quiet; then
            echo "Нет изменений в donaters.json - коммит не нужен."
            exit 0
          fi
          git commit -m "sync: update donaters.json from FunPayTools-Site"
          git push
