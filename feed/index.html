<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента смешных отзывов FunPay</title>
    <link rel="stylesheet" href="/feed/style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>ЛЕНТА СМЕШНЫХ ОТЗЫВОВ</h1>
        </header>

        <main id="feed" class="feed-container">
            <div class="loading">Загрузка ленты...</div>
        </main>

        <button id="addReviewBtn" class="floating-add-btn">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
    </div>

    <div id="appModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modalTitle">Только в приложении</h3>
            <p id="modalText">Текст</p>
            <a href="https://funpay.tools/android" class="modal-btn-download">Скачать приложение</a>
            <button class="modal-btn-close" id="closeModal">Понятно</button>
        </div>
    </div>

    <script src="/feed/script.js"></script>
</body>
</html>
